[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot-agent"
version = "0.2.0"
description = "Paper-to-code research workspaces, reviewed experiment runs and protocol-aware comparisons"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "streamlit==1.66.1",
  "langgraph==1.2.18", "langgraph-checkpoint-sqlite==3.1.2",
  "langchain-openai==1.7.3", "langchain-text-splitters==1.1.3",
  "mcp==2.3.0", "pypdf==6.21.3", "scikit-learn==1.9.1",
  "python-multipart==0.0.32", "pydantic-settings==2.16.1",
  "pyyaml==6.0.3", "httpx==0.28.1", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3", "reportlab==5.1.0"]

[project.scripts]
paperpilot = "paperpilot.cli:main"

[tool.setuptools.packages.find]
include = ["paperpilot*"]

[tool.setuptools.package-data]
paperpilot = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["network: opt-in live public GitHub integration"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
